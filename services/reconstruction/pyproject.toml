[project]
name = "tailorai-reconstruction"
version = "0.1.0"
description = "Stateless GPU inference service for human body reconstruction"
requires-python = ">=3.10,<3.13"

# Base install runs the full pipeline with the mock adapter — no torch, no
# weights, no GPU. Real models are an extra so CI and first-run setup stay fast.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0,<2.2",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.4.0",
    "trimesh>=4.5.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
# Real inference. Installs torch (~2.5 GB). See docs RUNBOOK.
models = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "timm>=1.0.0",
    "xatlas>=0.0.9",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
